<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Welcome — Animated</title>
  <style>
    :root{--bg1:#0f172a;--bg2:#0b1226;--accent1:#60a5fa;--accent2:#7c3aed;--glass: rgba(255,255,255,0.06);}    
    html,body{height:100%;margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial;}
    body{background:linear-gradient(120deg,var(--bg1),var(--bg2));display:grid;place-items:center;overflow:hidden;color:#e6eef8}

    /* animated gradient blob */
    .blob{position:absolute;inset:-20% auto auto -10%;width:80vmax;height:80vmax;border-radius:40vmax;filter:blur(120px);opacity:0.25;background:linear-gradient(90deg,var(--accent1),var(--accent2));animation:blobMove 14s ease-in-out infinite alternate;mix-blend-mode:screen}
    @keyframes blobMove{0%{transform:translate3d(-10%,0,0) scale(1)}50%{transform:translate3d(10%, -6%,0) scale(1.05)}100%{transform:translate3d(-10%, -12%,0) scale(1)} }

    /* subtle vignette */
    .vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center, rgba(0,0,0,0) 40%, rgba(0,0,0,0.45) 100%);pointer-events:none}

    /* card */
    .card{position:relative;z-index:5;min-width:300px;max-width:900px;width:86%;padding:36px;border-radius:18px;background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02));box-shadow:0 8px 30px rgba(2,6,23,0.6);backdrop-filter: blur(6px);border:1px solid rgba(255,255,255,0.04);display:flex;gap:20px;align-items:center}

    .left{flex:1;}
    .right{width:220px;display:flex;flex-direction:column;gap:12px;align-items:flex-end}

    h1{margin:0;font-size:clamp(18px,4.2vw,40px);line-height:1.02;letter-spacing:-0.02em}
    p.lead{margin:10px 0 0;color:rgba(230,238,248,0.85)}

    /* typewriter */
    .typewrap{display:inline-block;white-space:nowrap;overflow:hidden;border-right:3px solid rgba(230,238,248,0.8);box-sizing:content-box;padding-right:6px}
    .type{display:inline-block;animation:typing 3.6s steps(28,end) 1, blink .9s step-end infinite}
    @keyframes typing{from{width:0}to{width:100%}}
    @keyframes blink{50%{border-color:transparent}} 

    /* sub text badges */
    .meta{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap}
    .pill{background:var(--glass);padding:8px 12px;border-radius:999px;font-size:13px;color:#dbeafe;border:1px solid rgba(255,255,255,0.03)}

    /* CTA */
    .btn{appearance:none;border:0;padding:10px 16px;border-radius:12px;background:linear-gradient(90deg,var(--accent1),var(--accent2));color:#fff;font-weight:600;cursor:pointer;box-shadow:0 6px 20px rgba(92,123,255,0.14);transform:translateZ(0);transition:transform .15s ease,box-shadow .15s ease}
    .btn:active{transform:translateY(2px) scale(.997)}

    /* subtle floating icon */
    .card-illus{width:120px;height:120px;border-radius:12px;background:linear-gradient(135deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.04);transform:translateY(-2px);}
    .logo{font-weight:700;font-size:20px;color:transparent;background:linear-gradient(90deg,var(--accent1),var(--accent2));-webkit-background-clip:text;background-clip:text}

    /* small footnote */
    .foot{margin-top:10px;font-size:12px;color:rgba(230,238,248,0.65)}

    /* responsive */
    @media (max-width:640px){.card{flex-direction:column;align-items:stretch}.right{align-items:center;width:100%}}

    /* canvas (particles) */
    canvas.particles{position:fixed;inset:0;z-index:1;pointer-events:none}
  </style>
</head>
<body>
  <div class="blob" aria-hidden></div>
  <canvas class="particles" id="particles"></canvas>
  <div class="vignette"></div>

  <div class="card" role="region" aria-label="Welcome card">
    <div class="left">
      <h1>Welcome to <span class="typewrap" aria-hidden><span class="type">Landing Page ✨</span></span></h1>
      <p class="lead">Good Morning</p>

      <!-- <div class="meta" aria-hidden>
        <span class="pill">Fast · Lightweight</span>
        <span class="pill">Accessible</span>
        <span class="pill">No libraries</span>
      </div>

      <div style="margin-top:18px;display:flex;gap:12px;align-items:center;">
        <button class="btn" id="btnCelebrate">Let's go!</button>
        <div class="foot">Built with HTML, CSS & JS · single file</div>
      </div> -->
    </div>

    <div class="right">
      <div class="card-illus" aria-hidden>
        <div class="logo">WELCOME</div>
      </div>
      <!-- <div style="font-size:13px;color:rgba(230,238,248,0.7);text-align:right">Have a great session.<br><strong style="color:var(--accent1)">Enjoy ✨</strong></div> -->
    </div>
  </div>

  <script>
    // --- small particle system ---
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    let w = canvas.width = innerWidth;
    let h = canvas.height = innerHeight;

    window.addEventListener('resize', ()=>{w=canvas.width=innerWidth;h=canvas.height=innerHeight})

    const particles = [];
    const P = 80; // particle count
    for(let i=0;i<P;i++) particles.push({x:Math.random()*w,y:Math.random()*h, vx:(Math.random()-0.5)*0.35, vy:(Math.random()-0.5)*0.35, r:Math.random()*1.3+0.3, a:Math.random()*0.6+0.2});

    function step(){
      ctx.clearRect(0,0,w,h);
      for(let p of particles){
        p.x += p.vx; p.y += p.vy;
        if(p.x<0) p.x=w; if(p.x>w) p.x=0; if(p.y<0) p.y=h; if(p.y>h) p.y=0;
        ctx.beginPath(); ctx.globalAlpha=p.a; ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fillStyle='white'; ctx.fill();
      }
      requestAnimationFrame(step);
    }
    step();

    // --- small confetti burst on button click ---
    function confettiBurst(x,y){
      const pieces = [];
      for(let i=0;i<40;i++){
        pieces.push({x,y,vx:(Math.random()-0.5)*6,vy:Math.random()*-6-1,rot:Math.random()*360,vr:Math.random()*10-5,life:Math.random()*60+40,color:['#60a5fa','#7c3aed','#34d399','#f97316'][Math.floor(Math.random()*4)]});
      }
      let t=0; const confCanvas = document.createElement('canvas'); confCanvas.style.position='fixed';confCanvas.style.left=0;confCanvas.style.top=0;confCanvas.width=innerWidth;confCanvas.height=innerHeight;confCanvas.style.zIndex=9999;document.body.appendChild(confCanvas); const c=confCanvas.getContext('2d');
      function draw(){
        c.clearRect(0,0,confCanvas.width,confCanvas.height);
        for(let i=pieces.length-1;i>=0;i--){
          const p=pieces[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.12; p.rot+=p.vr; p.life--;
          c.save(); c.translate(p.x,p.y); c.rotate(p.rot*Math.PI/180); c.fillStyle=p.color; c.fillRect(-4,-2,8,4); c.restore();
          if(p.life<0) pieces.splice(i,1);
        }
        if(pieces.length>0) requestAnimationFrame(draw); else { confCanvas.remove(); }
      }
      draw();
    }

    document.getElementById('btnCelebrate').addEventListener('click', (e)=>{
      const r = e.currentTarget.getBoundingClientRect();
      confettiBurst(r.left + r.width/2, r.top + r.height/2);
      // small focus/feedback
      e.currentTarget.blur();
    });

    // accessibility: reduce motion respect
    const prefersReduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(prefersReduced){
      canvas.style.display='none'; document.querySelector('.blob').style.animation='none'; document.querySelector('.type').style.animation='none';
    }
  </script>
</body>
</html>
