apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-web
  namespace: webapps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-web
  template:
    metadata:
      labels:
        app: hello-web
    spec:
      containers:
        - name: hello-web
          image: hello-web:202510281246
        imagePullPolicy: Never
          ports:
            - containerPort: 80
