apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-app
  namespace: webapps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-app
  template:
    metadata:
      labels:
        app: k8s-app
    spec:
      containers:
        - name: k8s-app
          image: smitdarji/k8s:v0.0.6
          ports:
            - containerPort: 80
