apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: login-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/smit-darji/argocd_cicd.git
    targetRevision: Master
    path: k8s       # ✅ must match your folder name
  destination:
    server: https://kubernetes.default.svc
    namespace: webapps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
