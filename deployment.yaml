apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-web
  namespace: webapps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-web
  template:
    metadata:
      labels:
        app: hello-web
    spec:
      containers:
        - name: hello-web
          image: hello-web:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: hello-web-service
  namespace: webapps
spec:
  selector:
    app: hello-web
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
  type: NodePort
