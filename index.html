<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArgoCD GitOps Login</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #0d47a1, #1976d2);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
    }

    .login-container {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 40px;
      width: 350px;
      text-align: center;
      box-shadow: 0 0 20px rgba(0,0,0,0.2);
    }

    .login-container h1 {
      margin-bottom: 20px;
      font-size: 1.8em;
      letter-spacing: 1px;
    }

    .login-container p {
      margin-bottom: 30px;
      font-size: 0.95em;
      color: #e3f2fd;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 8px;
      background-color: rgba(255,255,255,0.9);
      font-size: 1em;
      outline: none;
    }

    input[type="submit"] {
      width: 100%;
      padding: 12px;
      background-color: #1e88e5;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 1em;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    input[type="submit"]:hover {
      background-color: #1565c0;
    }

    .footer {
      margin-top: 25px;
      font-size: 0.85em;
      color: #fbff00;
    }

    @media (max-width: 400px) {
      .login-container {
        width: 90%;
        padding: 30px;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h1>🔐 Login Page</h1>
    <p>Welcome to the ArgoCD GitOps Dashboard</p>

    <form>
      <input type="text" placeholder="Username" required>
      <input type="password" placeholder="Password" required>
      <input type="submit" value="Login">
    </form>

    <div class="footer">
      <p>Version 1.0 - Deployed via ArgoCD GitOps</p>
    </div>
  </div>
</body>
</html>
